<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Console Admin — Réinitialisation du mot de passe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.4rem; color: #1e293b; margin-bottom: 0.25rem; }
    p.subtitle { font-size: 0.875rem; color: #64748b; margin-bottom: 2rem; }
    label { display: block; font-size: 0.85rem; color: #374151; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #4F46E5; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .error.visible { display: block; }
    .success {
      display: none;
      background: #dcfce7;
      color: #166534;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .success.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Définir mon mot de passe</h1>
    <p class="subtitle">Choisissez un nouveau mot de passe pour votre compte </p>

    <div class="error" id="errorBox"></div>
    <div class="success" id="successBox"></div>

    <label for="password">Nouveau mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" />

    <label for="confirm">Confirmer le mot de passe</label>
    <input type="password" id="confirm" placeholder="••••••••" />

    <button id="resetBtn">Définir le mot de passe</button>
  </div>

  <script>
    const BASE_URL = '{{BASE_URL}}'
    const TOKEN = '{{TOKEN}}'
    const LOGIN_URL = '{{LOGIN_URL}}'

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const password = document.getElementById('password').value.trim()
      const confirm = document.getElementById('confirm').value.trim()
      const errorBox = document.getElementById('errorBox')
      const successBox = document.getElementById('successBox')
      const btn = document.getElementById('resetBtn')

      errorBox.classList.remove('visible')
      successBox.classList.remove('visible')

      // Validation côté client
      if (!password || !confirm) {
        errorBox.textContent = 'Veuillez remplir tous les champs.'
        errorBox.classList.add('visible')
        return
      }

      if (password.length < 8) {
        errorBox.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'
        errorBox.classList.add('visible')
        return
      }

      if (password !== confirm) {
        errorBox.textContent = 'Les mots de passe ne correspondent pas.'
        errorBox.classList.add('visible')
        return
      }

      btn.disabled = true
      btn.textContent = 'Enregistrement...'

      try {
        const res = await fetch(`${BASE_URL}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN, password }),
        })

        const data = await res.json()

        if (!res.ok) {
          errorBox.textContent = data.message || 'Une erreur est survenue.'
          errorBox.classList.add('visible')
          btn.disabled = false
          btn.textContent = 'Définir le mot de passe'
          return
        }

        // Succès : afficher le message et rediriger vers le login
        successBox.textContent = 'Mot de passe défini avec succès ! Redirection...'
        successBox.classList.add('visible')
        btn.textContent = 'Succès'

        setTimeout(() => {
         window.location.href = LOGIN_URL
        }, 2000)

      } catch (err) {
        errorBox.textContent = 'Erreur réseau, réessayez.'
        errorBox.classList.add('visible')
        btn.disabled = false
        btn.textContent = 'Définir le mot de passe'
      }
    })
  </script>
</body>
</html>
